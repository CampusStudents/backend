name: Release app workflow
on:
  push:
    branches:
      - main
      - ci-cd-branch
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
        contents: write
        issues: write
        pull-requests: write
        id-token: write

    outputs:
        new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "lts/*"

        - name: Run semantic-release
          id: semantic-release
          uses: cycjimmy/semantic-release-action@v6
          env:
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  deploy:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ansible
        run: pipx install --include-deps ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yaml

      - name: Set up SSH
        shell: bash
        run: |
          eval '$(ssh-agent -s)'
          mkdir -p ~/.ssh/
          touch ~/.ssh/id_ed25519
          echo -e "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          ssh-add ~/.ssh/id_ed25519
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock

      - name: Create inventory
        run: |
          cat > ansible/inventory.ini << EOF
          [vms.vars]
          ansible_user=${{ secrets.VM_USER }}
          ansible_ssh_private_key_file=~/.ssh/id_ed25519

          [vms]
          ${{ secrets.VM_HOST }}
          EOF

      - name: Run playbook
        run: |
          cd ansible
          ansible-playbook \
          -i inventory.ini \
          playbooks/build-image-playbook.yaml
          
          ansible-playbook \
          -i inventory.ini \
          playbooks/compose-update-playbook.yaml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_FORCE_COLOR: "true"
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          CI_COMMIT_TAG: ${{ needs.release.outputs.new_release_version }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
