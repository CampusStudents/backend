
x-backend-image: &backend-image "royrenie/backend:v3"
x-frontend-image: &frontend-image "nginx:1.29-alpine"

x-backend-base: &backend-base
  image: *backend-image
  env_file:
    - .env
  environment:
    APP__DB__HOST: pg
    APP__RUN__HOST: 0.0.0.0
    APP__EMAIL__SMTP_HOST: maildev
    APP__AWS__ACCESS_KEY: ${APP__AWS__ACCESS_KEY:-campus}
    APP__AWS__SECRET_KEY: ${APP__AWS__SECRET_KEY:-campus-secret}
    APP__AWS__ENDPOINT_URL: ${APP__AWS__ENDPOINT_URL:-http://minio:9000}
    APP__AWS__REGION_NAME: ${APP__AWS__REGION_NAME:-us-east-1}
    APP__AWS__BUCKET_NAME: ${APP__AWS__BUCKET_NAME:-campus}
    APP__AWS__DOMAIN: ${APP__AWS__DOMAIN:-http://localhost:9000/campus}
    APP__AWS__FOLDER: ${APP__AWS__FOLDER:-uploads}
    APP__AWS__USE_PATH_STYLE: ${APP__AWS__USE_PATH_STYLE:-true}

services:
  alembic:
    <<: *backend-base
    depends_on:
      pg:
        condition: service_healthy
    command: [ "alembic", "upgrade", "head" ]

  rbac:
    <<: *backend-base
    depends_on:
      alembic:
        condition: service_completed_successfully
    command: [ "python", "-m", "src.service.rbac.cli" ]

  backend:
    <<: *backend-base
    expose:
      - "8000"
    depends_on:
      rbac:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: *frontend-image
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  pg:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 3
  maildev:
    image: maildev/maildev
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  minio:
    image: minio/minio:latest
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${APP__AWS__ACCESS_KEY:-campus}
      MINIO_ROOT_PASSWORD: ${APP__AWS__SECRET_KEY:-campus-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "-s", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${APP__AWS__ACCESS_KEY:-campus}
      MINIO_ROOT_PASSWORD: ${APP__AWS__SECRET_KEY:-campus-secret}
      MINIO_BUCKET: ${APP__AWS__BUCKET_NAME:-campus}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET}\" &&
      mc anonymous set download local/\"$${MINIO_BUCKET}\"
      "

volumes:
  pg_data:
  minio_data:
